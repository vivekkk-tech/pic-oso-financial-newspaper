name: PICOSO Zero-Cost Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate PICOSO edition
        run: node generate.mjs

      - name: Commit generated edition
        run: |
          git config user.name "PICOSO Bot"
          git config user.email "actions@github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Update PICOSO daily edition"
            git push
          fi
